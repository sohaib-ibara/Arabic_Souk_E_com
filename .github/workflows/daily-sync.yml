# Daily supplier sync — the sources that can run in the cloud.
#
# ⚠️  noon is NOT here, and cannot be. It sits behind Akamai Bot Manager and was
# measured refusing every datacentre IP we tried, 20/20 (docs/SUPPLIER_SYNC.md).
# Adding it to this workflow would produce a job that goes green every morning
# while fetching nothing — the worst possible failure, because the shop would
# look synced. noon runs from an office machine; see the same doc.
#
# Cult Beauty was measured answering plain HTTP from three Azure IPs, 30/30 —
# which is the datacentre class GitHub Actions runs in, so this is measured on
# the host it actually uses, not inferred.
#
# What a run does NOT do: change a price on the live shop, or list anything.
# Prices here are not the supplier's (noon's came in at SAR×0.1 and staff have
# corrected them by hand since) and curation is the client's. New products land
# in staging as 'pending'; changes are recorded for review. Delivery windows are
# the one thing written straight through — the supplier's own fact about its own
# logistics, which nobody edits here and which is a broken promise when stale.
name: daily supplier sync

on:
  schedule:
    # 02:20 UTC = 05:20 Bahrain — after the retailer's overnight price updates
    # and before anyone opens the admin. Not on the hour: GitHub queues those
    # heavily and a delayed start is a delayed sync.
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Adapter key (cloud-reachable sources only)"
        required: true
        default: cultbeauty
      apply:
        description: "Write to the database? 'no' for a dry run"
        required: true
        default: "yes"
      new_limit:
        description: "Most new products this run may take on (0 = refresh only)"
        required: false
        default: "40"

concurrency:
  # Two syncs of one source at once would race on the same staging rows.
  group: daily-sync-${{ github.event.inputs.site || 'cultbeauty' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` — that caches a dependency tree this job no longer
      # installs, and keying it on a lockfile we deliberately ignore would cache
      # the wrong thing. The one package below takes about three seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install ONLY what the sync imports. The application's lockfile is not
      # used here at all, and that is the point.
      #
      # Three runs were spent trying to make `npm ci` work against it:
      #
      #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
      #
      # First blamed on `--omit=dev`, then on npm 10 vs npm 11. Removing the
      # flag did not help; nor did Node 24. Every local reproduction passed,
      # because the resolver behaviour that rejects this lockfile does not occur
      # on the machine that wrote it.
      #
      # Stepping back: none of that install is needed. sync.mjs imports
      # @supabase/supabase-js and Node built-ins; discover.mjs adds node:zlib;
      # fetcher.mjs imports Playwright lazily, inside a branch this job never
      # takes. Next, React, Tailwind and sharp were only ever there because the
      # lockfile lists them — and it was sharp's optional wasm dependency that
      # broke the install. A daily job had been made to depend on the whole
      # application resolving cleanly on a platform nobody develops on.
      #
      # So: move the app's manifest aside, install the one package, put it back.
      # 9 packages, ~3s, and nothing to drift out of sync. The version is pinned
      # exactly; its own dependencies float, which is the one thing given up
      # versus a lockfile, and worth it for a job that otherwise does not run.
      # Bump it when the app's own version moves.
      - name: Install the sync's one dependency
        run: |
          node -v && npm -v
          mv package.json      "$RUNNER_TEMP/package.json.app"
          mv package-lock.json "$RUNNER_TEMP/package-lock.json.app"
          npm install --no-save --no-audit --no-fund @supabase/supabase-js@2.110.7
          mv "$RUNNER_TEMP/package.json.app"      package.json
          mv "$RUNNER_TEMP/package-lock.json.app" package-lock.json

      # Cult Beauty's product pages do not say what a product is. Its breadcrumb
      # is the brand path, so the only way to learn that something is a lipstick
      # is to see it on the lipstick shelf — which is what this walk records.
      #
      # It used to be missing here. The map is written as a dot-file under
      # scripts/import/, everything matching that pattern is gitignored as raw
      # supplier material, and so a cloud run had no map at all: every Cult
      # product it adopted was staged with no category. 243 of the 246 now in
      # the catalogue arrived that way, and the sync had been reporting it
      # honestly as `no_category_map` the whole time.
      #
      # Rebuilt each run rather than committed. A committed file would fix the
      # cloud runs and then rot — it would know nothing of the 40 products a
      # night this job adopts, which are precisely the ones needing a category.
      # Aisles change far more slowly than products, so a nightly rebuild is
      # generous; it is here because it costs a few minutes and removes a class
      # of problem rather than an instance of one.
      #
      # Rate-limited by the script itself (800ms between pages, 5 pages per
      # category, robots-permitted pages only). It never fails the job: a sync
      # that still detects every price change is worth far more than one that
      # refuses to run because a taxonomy walk timed out.
      - name: Rebuild the category map
        if: ${{ (github.event.inputs.site || 'cultbeauty') == 'cultbeauty' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          SITE: cultbeauty
        run: node scripts/import/map-categories.mjs

      # Cult Beauty needs no browser — that is the whole reason it can run here.
      # A source that needed one would need a residential IP too, and would not
      # belong in this workflow.
      - name: Sync
        env:
          SITE: ${{ github.event.inputs.site || 'cultbeauty' }}
          CONFIRM_SYNC: ${{ github.event.inputs.apply == 'no' && '0' || '1' }}
          # 0 = refresh only: re-check products we already hold and report what
          # the supplier changed, without adopting new ones.
          #
          # Was 0 — refresh only — because CI has no category map and every
          # product a run adopted arrived uncategorised. The client has since
          # been explicit that both scrapers must pick up whatever the supplier
          # adds, so this now grows the catalogue.
          #
          # Uncategorised is no longer a dead end: src/lib/category-aliases.ts
          # maps the shelves that have an equivalent here, and /admin/vendors
          # reports the rest as "N need a category" instead of letting them
          # pass unnoticed.
          #
          # 40 a night rather than everything at once. New products land in
          # staging and still need a human to bring them into the catalogue, so
          # a slower rate keeps that queue reviewable — and keeps the request
          # rate somewhere a retailer will not mind.
          NEW_LIMIT: ${{ github.event.inputs.new_limit || '40' }}
          REFRESH_LIMIT: "120"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import/sync.mjs

      # The run is recorded in `sync_runs` either way, so the admin dashboard
      # shows a failure even if nobody reads this log. This step exists so the
      # GitHub UI goes red too.
      - name: Report failure
        if: failure()
        run: |
          echo "::error::Sync failed for ${{ github.event.inputs.site || 'cultbeauty' }}."
          echo "The admin dashboard reads sync_runs and will show this as a failed run."
