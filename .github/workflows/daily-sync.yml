# Daily supplier sync — the sources that can run in the cloud.
#
# ⚠️  noon is NOT here, and cannot be. It sits behind Akamai Bot Manager and was
# measured refusing every datacentre IP we tried, 20/20 (docs/SUPPLIER_SYNC.md).
# Adding it to this workflow would produce a job that goes green every morning
# while fetching nothing — the worst possible failure, because the shop would
# look synced. noon runs from an office machine; see the same doc.
#
# Cult Beauty was measured answering plain HTTP from three Azure IPs, 30/30 —
# which is the datacentre class GitHub Actions runs in, so this is measured on
# the host it actually uses, not inferred.
#
# What a run does NOT do: change a price on the live shop, or list anything.
# Prices here are not the supplier's (noon's came in at SAR×0.1 and staff have
# corrected them by hand since) and curation is the client's. New products land
# in staging as 'pending'; changes are recorded for review. Delivery windows are
# the one thing written straight through — the supplier's own fact about its own
# logistics, which nobody edits here and which is a broken promise when stale.
name: daily supplier sync

on:
  schedule:
    # 02:20 UTC = 05:20 Bahrain — after the retailer's overnight price updates
    # and before anyone opens the admin. Not on the hour: GitHub queues those
    # heavily and a delayed start is a delayed sync.
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Adapter key (cloud-reachable sources only)"
        required: true
        default: cultbeauty
      apply:
        description: "Write to the database? 'no' for a dry run"
        required: true
        default: "yes"
      new_limit:
        description: "Most new products this run may take on (0 = refresh only)"
        required: false
        default: "0"

concurrency:
  # Two syncs of one source at once would race on the same staging rows.
  group: daily-sync-${{ github.event.inputs.site || 'cultbeauty' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node 24, not 22, and the version matters.
      #
      # package-lock.json was written by npm 11. Node 22 ships npm 10, which
      # builds a different ideal tree from the same lockfile and then rejects it:
      #
      #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
      #
      # npm 11 considers that same file up to date — checked directly, including
      # with --os=linux --cpu=x64, so it is a resolver difference between npm
      # majors and not a platform gap. Matching the npm that wrote the lockfile
      # is the fix; regenerating it under npm 10 would only invert the problem
      # for everyone developing on Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A full `npm ci`, deliberately — NOT `--omit=dev`.
      #
      # `--omit=dev` was tried and broke the first three scheduled runs:
      #
      #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
      #
      # `@img/sharp-wasm32` is an optional PROD dependency that needs
      # `@emnapi/runtime`, and the lockfile's only copy of it sits nested under
      # a DEV package. A full install resolves that fine; pruning the dev tree
      # leaves the prod side with an unsatisfiable requirement, and npm refuses.
      # It passed locally because Windows skips that optional package entirely,
      # so the constraint never arises here — only on Linux.
      #
      # The dev tree costs a few seconds. The only reason to prune it was
      # Playwright's ~500MB browser download, and that is what the env var below
      # actually turns off. Nothing in this job launches a browser: the sole
      # browser source is noon, which cannot run in CI at all.
      #
      # No fallback to `npm install` on failure. A daily unattended job that
      # quietly switches to unpinned resolution when the lockfile drifts is how
      # you get a sync that works until the day it silently doesn't. Let it fail
      # loudly — sync_runs records that, and /admin/sync shows it.
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          node -v && npm -v
          npm ci

      # Cult Beauty needs no browser — that is the whole reason it can run here.
      # A source that needed one would need a residential IP too, and would not
      # belong in this workflow.
      #
      # ⚠️ The category map is a local build artefact and is gitignored, so runs
      # here have none: new products are staged UNCATEGORISED and the run says
      # so. Change detection on products we already hold is unaffected, and is
      # the half that matters daily. Fix by moving the map into the database.
      - name: Sync
        env:
          SITE: ${{ github.event.inputs.site || 'cultbeauty' }}
          CONFIRM_SYNC: ${{ github.event.inputs.apply == 'no' && '0' || '1' }}
          # 0 = refresh only: re-check products we already hold and report what
          # the supplier changed, without adopting new ones.
          #
          # Deliberate for now. CI has no category map, so every product a run
          # adopts arrives uncategorised — and 58 of the 62 Cult Beauty
          # categories have no home in our taxonomy yet anyway. Accumulating
          # uncategorised rows nightly would just make that decision messier to
          # act on. Change detection is the half that is useful today, and it
          # needs no map. Raise this once the taxonomy is settled.
          NEW_LIMIT: ${{ github.event.inputs.new_limit || '0' }}
          REFRESH_LIMIT: "120"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import/sync.mjs

      # The run is recorded in `sync_runs` either way, so the admin dashboard
      # shows a failure even if nobody reads this log. This step exists so the
      # GitHub UI goes red too.
      - name: Report failure
        if: failure()
        run: |
          echo "::error::Sync failed for ${{ github.event.inputs.site || 'cultbeauty' }}."
          echo "The admin dashboard reads sync_runs and will show this as a failed run."
